services:
  - type: web
    name: mmm-analytics-bot
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "6656667725"
      - key: NOTIFY_IN_GROUP
        value: "false"
      - key: BOT_MODE
        value: "polling"
      - key: ENVIRONMENT
        value: "production"
      - key: PORT
        value: "8000"
      - key: WEB_APP_URL
        value: "https://mmm-analytics-bot-vo52.onrender.com"
