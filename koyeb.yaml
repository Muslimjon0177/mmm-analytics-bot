# Koyeb Service Deployment Configuration
name: mmm-analytics-bot
type: web
regions:
  - fra # Frankfurt (Fastest for Europe/Central Asia)
plan: nano
instance_type: nano
ports:
  - port: 8000
    protocol: http
routes:
  - path: /
    port: 8000
health_checks:
  - http:
      path: /health
      port: 8000
    initial_delay: 15
    interval: 30
    timeout: 5
    unhealthy_threshold: 3
    healthy_threshold: 1
env:
  - key: PORT
    value: "8000"
  - key: BOT_MODE
    value: "polling"
  - key: ENVIRONMENT
    value: "production"
